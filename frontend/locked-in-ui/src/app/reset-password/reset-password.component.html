<div class="rp-container">
  <div class="rp-card">
    <div class="rp-logo">TOKISPIRIT</div>

    <ng-container *ngIf="!done">
      <h2 class="rp-title">Set a new password</h2>
      <p class="rp-desc">Choose a strong password — at least 8 characters.</p>

      <div class="rp-error" *ngIf="error">{{ error }}</div>

      <ng-container *ngIf="!error || error !== 'Invalid or missing reset link.'">
        <input class="rp-input" type="password" placeholder="New password"
               [(ngModel)]="newPassword" name="np" autocomplete="new-password">
        <input class="rp-input" type="password" placeholder="Confirm password"
               [(ngModel)]="confirmPassword" name="cp" autocomplete="new-password">
        <button class="rp-btn" [disabled]="loading" (click)="submit()">
          {{ loading ? 'SAVING...' : 'RESET PASSWORD' }}
        </button>
      </ng-container>
    </ng-container>

    <ng-container *ngIf="done">
      <div class="rp-success">✓ Password updated successfully.</div>
      <button class="rp-btn" (click)="goLogin()">GO TO LOGIN →</button>
    </ng-container>
  </div>
</div>
