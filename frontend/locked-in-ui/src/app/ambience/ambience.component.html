<div class="amb-panel" (click)="$event.stopPropagation()">

  <!-- Header -->
  <div class="amb-header">
    <div class="amb-hud-left">
      <span class="amb-logo">LOCKED IN</span>
      <span class="amb-sep">·</span>
      <span class="amb-tag">AMBIENCE</span>
    </div>
    <button class="amb-close" (click)="close()">✕</button>
  </div>

  <!-- Tab nav -->
  <div class="amb-tabs">
    <button class="amb-tab" [class.active]="activeTab === 'animations'" (click)="setActiveTab('animations')">ANIMATIONS</button>
    <button class="amb-tab" [class.active]="activeTab === 'sounds'" (click)="setActiveTab('sounds')">SOUNDS</button>
  </div>

  <!-- Live theme warning -->
  <div class="amb-warning" *ngIf="warningMessage">
    <span class="amb-warn-icon">⚠</span> {{ warningMessage }}
  </div>

  <!-- Animations tab -->
  <div class="amb-content" *ngIf="activeTab === 'animations'">
    <div
      class="amb-card"
      *ngFor="let effect of effects"
      [class.on]="effect.enabled"
      [class.disabled]="isEffectsDisabled"
      (click)="toggleEffect(effect.id)">
      <div class="amb-card-icon">{{ effect.icon }}</div>
      <div class="amb-card-body">
        <div class="amb-card-name">{{ effect.name }}</div>
        <div class="amb-card-desc">{{ effect.description }}</div>
      </div>
      <div class="amb-pill" [class.on]="effect.enabled">{{ effect.enabled ? 'ON' : 'OFF' }}</div>
    </div>

    <button class="amb-reset" (click)="resetAll()" [disabled]="isEffectsDisabled">RESET ALL</button>
  </div>

  <!-- Sounds tab -->
  <div class="amb-content amb-soon" *ngIf="activeTab === 'sounds'">
    <div class="amb-soon-icon">🎵</div>
    <div class="amb-soon-text">Sound effects coming soon</div>
  </div>

</div>
