<app-tutorial-modal
  *ngIf="showTutorial"
  [steps]="tutorialSteps"
  [featureName]="'Themes'"
  (onComplete)="onTutorialComplete($event)"
  (onSkip)="onTutorialSkip()">
</app-tutorial-modal>

<div class="themes-container">

  <!-- HUD Header -->
  <div class="themes-header">
    <div class="themes-hud-left">
      <span class="themes-hud-logo">LOCKED IN</span>
      <span class="themes-hud-tag">WALLPAPERS</span>
    </div>
    <div class="themes-hud-right">
      <div class="live-toggle">
        <span class="toggle-option" [class.active]="!showLiveThemes" (click)="showLiveThemes && toggleLiveThemes()">STATIC</span>
        <span class="toggle-divider">|</span>
        <span class="toggle-option" [class.active]="showLiveThemes" (click)="!showLiveThemes && toggleLiveThemes()">LIVE</span>
      </div>
    </div>
  </div>

  <!-- Category Tabs -->
  <div class="category-tabs">
    <div *ngFor="let category of categories"
         class="category-tab"
         [class.active]="selectedCategory === category.id"
         (click)="filterThemes(category.id)">
      <img [src]="category.icon" [alt]="category.name" class="category-icon">
      <span>{{ category.name }}</span>
    </div>
  </div>

  <!-- Gallery Section -->
  <div class="themes-section">

    <!-- Pagination Controls -->
    <div class="pagination-controls" *ngIf="totalPages > 1">
      <button class="pagination-btn" [disabled]="!canGoPrevious()" (click)="previousPage()">&#8249;</button>
      <span class="page-info">{{ currentPage + 1 }} / {{ totalPages }}</span>
      <button class="pagination-btn" [disabled]="!canGoNext()" (click)="nextPage()">&#8250;</button>
    </div>

    <!-- Themes Grid -->
    <div class="themes-gallery">
      <div *ngFor="let theme of paginatedThemes"
           class="theme-item"
           [class.selected]="isSelected(theme.path)"
           [class.locked]="theme.premium && !theme.unlocked"
           (click)="changeTheme(theme)">

        <img [src]="theme.path" [alt]="theme.name" class="theme-image">

        <!-- Name overlay -->
        <div class="theme-name-overlay">{{ theme.name }}</div>

        <!-- Selected ring -->
        <div *ngIf="isSelected(theme.path)" class="selected-ring"></div>

        <!-- Premium lock overlay -->
        <div *ngIf="theme.premium && !theme.unlocked" class="premium-overlay">
          <span class="lock-icon">🔒</span>
          <div class="premium-cost">
            <img src="assets/images/goldcoin.png" alt="Gold" class="gold-icon">
            <span>{{ theme.goldCost || 500 }}</span>
          </div>
        </div>

        <!-- Badges -->
        <div class="badge-row">
          <span *ngIf="theme.isLive" class="badge badge-live">LIVE</span>
          <span *ngIf="theme.premium && theme.unlocked" class="badge badge-unlocked">✓</span>
        </div>

      </div>
    </div>

    <!-- Page Dots -->
    <div class="page-dots" *ngIf="totalPages > 1 && totalPages <= 10">
      <span *ngFor="let page of getPageNumbers(); let i = index"
            class="page-dot"
            [class.active]="currentPage === i"
            (click)="goToPage(i)">
      </span>
    </div>

  </div>

  <!-- Empty State -->
  <div *ngIf="paginatedThemes.length === 0" class="empty-state">
    <p>No wallpapers found. Try a different category or filter.</p>
  </div>

</div>
