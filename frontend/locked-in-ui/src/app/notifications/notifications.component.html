<div class="notifications-overlay" (click)="closeNotifications()">
  <div class="notifications-panel" (click)="$event.stopPropagation()">

    <div class="notifications-header">
      <span class="notifications-title">Updates</span>
      <button class="close-btn" (click)="closeNotifications()">×</button>
    </div>

    <div class="notifications-body">
      <div *ngIf="notifications.length === 0" class="empty-state">
        <div class="empty-icon">🔔</div>
        <div class="empty-text">No updates yet</div>
        <div class="empty-sub">Check back later for news & announcements</div>
      </div>

      <div *ngFor="let n of notifications" class="notification-item" [class.unread]="n.isNew">
        <div class="notification-icon">{{ n.icon }}</div>
        <div class="notification-content">
          <div class="notification-title">{{ n.title }}<span *ngIf="n.isNew" class="new-badge">NEW</span></div>
          <div class="notification-message">{{ n.message }}</div>
          <div class="notification-date">{{ n.date }}</div>
        </div>
      </div>
    </div>

  </div>
</div>
