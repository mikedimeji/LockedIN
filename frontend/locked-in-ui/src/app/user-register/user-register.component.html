<!-- Welcome gift overlay (shown after successful registration) -->
<div *ngIf="showWelcomeGift" class="welcome-overlay">
  <div class="welcome-card" [class.claimed]="claimed">

    <div class="welcome-hud">
      <span class="welcome-logo">TOKISPIRIT</span>
      <span class="welcome-sep">·</span>
      <span class="welcome-tag">WELCOME BONUS</span>
    </div>

    <div class="welcome-coin-wrap">
      <img src="assets/images/coin/coin2.gif" alt="Gold Coin" class="welcome-coin">
      <div *ngIf="claimed" class="sparkle-ring"></div>
    </div>

    <div class="welcome-amount" [class.pop]="claimed">+200</div>
    <div class="welcome-gold-label">GOLD</div>

    <p class="welcome-msg" *ngIf="!claimed">
      Thanks for joining TokiSpirit!<br>
      Claim your welcome bonus and start unlocking themes &amp; avatars.
    </p>
    <p class="welcome-msg claimed-msg" *ngIf="claimed">
      Reward claimed! Heading to login...
    </p>

    <button class="welcome-btn" [class.claimed-btn]="claimed" (click)="claimReward()" [disabled]="claimed">
      <span *ngIf="!claimed">⚡ CLAIM REWARD</span>
      <span *ngIf="claimed">✓ CLAIMED</span>
    </button>

  </div>
</div>

<div *ngIf="isLoading" class="loading-overlay">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <p>Creating your account...</p>
  </div>
</div>

<div class="register-container" [class.blurred]="showWelcomeGift" (click)="onBackdropClick($event)">
  <div id="formContent" (click)="$event.stopPropagation()">
    <button class="close-button" (click)="closeRegisterScreen()">✕</button>

    <div class="alert alert-warning" *ngIf="invalidRegister">{{errorMessage}}</div>

    <h2>Register</h2>

    <form>
      <input type="text"
             id="username"
             [(ngModel)]="username"
             name="username"
             placeholder="Username"
             (ngModelChange)="clearError()"
             required>

      <input type="email"
             id="email"
             [(ngModel)]="email"
             name="email"
             placeholder="Email"
             (ngModelChange)="clearError()"
             required>

      <input type="password"
             id="password"
             [(ngModel)]="password"
             name="password"
             placeholder="Password"
             (ngModelChange)="clearError()"
             required>

      <input type="submit"
             (click)="handleRegister()"
             value="Register">
    </form>

    <div class="auth-link">
      Already have an account? <a routerLink="/login">Login</a>
    </div>
  </div>
</div>
