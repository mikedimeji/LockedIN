<app-tutorial-modal
  *ngIf="showTutorial"
  [steps]="tutorialSteps"
  [featureName]="'Timer'"
  (onComplete)="onTutorialComplete($event)"
  (onSkip)="onTutorialSkip()">
</app-tutorial-modal>

<div class="timer" [ngClass]="{'expanded': isExpanded}">
  <div class="time-display" (mouseenter)="showTooltip()" (mouseleave)="hideTooltip()" (click)="handleTimeClick()">
    <input type="text" [value]="formatTime(hours)" (input)="handleInputChange($event, 'hours')" [disabled]="isRunning" class="time-input">
    :
    <input type="text" [value]="formatTime(minutes)" (input)="handleInputChange($event, 'minutes')" [disabled]="isRunning" class="time-input">
    :
    <input type="text" [value]="formatTime(seconds)" (input)="handleInputChange($event, 'seconds')" [disabled]="isRunning" class="time-input">
    
    <!-- Pause/Resume Speech Bubble -->
    <div class="speech-bubble" *ngIf="showPauseTooltip">
      <div class="bubble-content">
        <span>{{ getTooltipMessage() }}</span>
      </div>
      <div class="bubble-tail"></div>
    </div>
  </div>

  <!-- Controls shown only in non-expanded state -->
  <div class="controls" *ngIf="!isExpanded">
    <button (click)="startTimer()">Start</button>
  </div>

  <!-- Controls shown only in expanded state -->
  <div class="expanded-controls" *ngIf="isExpanded">
    <button (click)="pauseTimer()">{{ isRunning ? 'Pause' : 'Resume' }}</button>
    <button (click)="openConfirmDialog()">Reset</button>
  </div>

  <!-- Heart Break Warning -->
  <div class="heart-warning-overlay" *ngIf="showHeartWarning">
    <div class="heart-warning-dialog">
      <div class="heart-warning-icon"><img src="assets/images/hearts/singleheart-halfblue.png" alt="heart"></div>
      <h3>Break your heart?</h3>
      <p>Stopping mid-session will cost you a heart.<span *ngIf="heartPoints === 1"> You only have one left — losing it resets your streak!</span></p>
      <div class="heart-warning-buttons">
        <button class="heart-btn-yes" (click)="onHeartWarningConfirm()">Yes, break it</button>
        <button class="heart-btn-no" (click)="onHeartWarningCancel()">Keep going</button>
      </div>
    </div>
  </div>

  <!-- Gold and streak earned message -->
  <div class="reward-message" *ngIf="showGoldMessage" [ngClass]="{'show': showGoldMessage}">
    <div class="reward-icons">
      <div class="reward-icon" *ngIf="goldEarned > 0">
        <img src="assets/images/goldcoin.png" alt="Gold">
      </div>
      <div class="reward-icon streak" *ngIf="streakUpdated">
        <img src="assets/images/fire.gif" alt="Streak">
      </div>
    </div>
    <div class="reward-text" [innerHTML]="getGoldMessage()"></div>
  </div>
  
</div>
