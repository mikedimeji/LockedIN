<app-tutorial-modal
  *ngIf="showTutorial"
  [steps]="tutorialSteps"
  [featureName]="'Timer'"
  (onComplete)="onTutorialComplete($event)"
  (onSkip)="onTutorialSkip()">
</app-tutorial-modal>

<div class="timer" [ngClass]="{'expanded': isExpanded, 'opacity-glass': timerOpacity === 1, 'opacity-ghost': timerOpacity === 2}">

  <!-- ── Collapsed card ── -->
  <ng-container *ngIf="!isExpanded">
    <button class="timer-opacity-btn" (click)="cycleOpacity()" [title]="timerOpacity === 0 ? 'Make transparent' : timerOpacity === 1 ? 'Go ghost' : 'Make opaque'">
      {{ timerOpacity === 0 ? '◐' : timerOpacity === 1 ? '○' : '●' }}
    </button>
    <div class="timer-session-label">FOCUS SESSION</div>

    <div class="time-display" (click)="handleTimeClick()">
      <input type="text" [value]="formatTime(hours)"   (input)="handleInputChange($event, 'hours')"   [disabled]="isRunning" class="time-input">
      <span class="t-sep">:</span>
      <input type="text" [value]="formatTime(minutes)" (input)="handleInputChange($event, 'minutes')" [disabled]="isRunning" class="time-input">
      <span class="t-sep">:</span>
      <input type="text" [value]="formatTime(seconds)" (input)="handleInputChange($event, 'seconds')" [disabled]="isRunning" class="time-input">
    </div>

    <div class="controls">
      <button (click)="startTimer()">START →</button>
    </div>
  </ng-container>

  <!-- ── Expanded fullscreen ── -->
  <ng-container *ngIf="isExpanded">
    <button class="timer-opacity-btn" (click)="cycleOpacity()" [title]="timerOpacity === 0 ? 'Make transparent' : timerOpacity === 1 ? 'Go ghost' : 'Make opaque'">
      {{ timerOpacity === 0 ? '◐' : timerOpacity === 1 ? '○' : '●' }}
    </button>
    <div class="time-display expanded-time" (click)="handleTimeClick()">
      <input type="text" [value]="formatTime(hours)"   (input)="handleInputChange($event, 'hours')"   [disabled]="isRunning" class="time-input">
      <span class="t-sep">:</span>
      <input type="text" [value]="formatTime(minutes)" (input)="handleInputChange($event, 'minutes')" [disabled]="isRunning" class="time-input">
      <span class="t-sep">:</span>
      <input type="text" [value]="formatTime(seconds)" (input)="handleInputChange($event, 'seconds')" [disabled]="isRunning" class="time-input">
    </div>

    <div class="expanded-controls">
      <button class="btn-pause" (click)="pauseTimer()">{{ isRunning ? 'PAUSE' : 'RESUME' }}</button>
      <button class="btn-reset" (click)="openConfirmDialog()">END</button>
    </div>
  </ng-container>

  <!-- ── Heart break warning ── -->
  <div class="heart-warning-overlay" *ngIf="showHeartWarning">
    <div class="heart-warning-dialog">
      <div class="heart-warning-icon">
        <img *ngIf="heartService.currentHeartPoints >= 2" src="assets/images/hearts/redheart.png" alt="heart">
        <img *ngIf="heartService.currentHeartPoints === 1" src="assets/images/hearts/heart-halfred.png" alt="heart">
      </div>
      <h3>Break your heart?</h3>
      <p>Stopping mid-session will cost you a heart.<span *ngIf="heartService.currentHeartPoints === 1"> You only have one left — losing it resets your streak!</span></p>
      <div class="heart-warning-buttons">
        <button class="heart-btn-yes" (click)="onHeartWarningConfirm()">Yes, break it</button>
        <button class="heart-btn-no" (click)="onHeartWarningCancel()">Keep going</button>
      </div>
    </div>
  </div>

  <!-- ── Reward message ── -->
  <div class="reward-message" *ngIf="showGoldMessage" [ngClass]="{'show': showGoldMessage}">
    <div class="reward-icons">
      <div class="reward-icon" *ngIf="goldEarned > 0">
        <img src="assets/images/goldcoin.png" alt="Gold">
      </div>
      <div class="reward-icon streak" *ngIf="streakUpdated">
        <img src="assets/images/fire.gif" alt="Streak">
      </div>
    </div>
    <div class="reward-text" [innerHTML]="getGoldMessage()"></div>
  </div>

</div>
