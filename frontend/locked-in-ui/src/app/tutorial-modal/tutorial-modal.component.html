<div class="tut-overlay" (click)="onBackdropClick($event)">
  <div class="tut-card" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="tut-header">
      <div class="tut-hud-left">
        <span class="tut-logo">TOKISPIRIT</span>
        <span class="tut-sep">·</span>
        <span class="tut-feature">{{ featureName | uppercase }}</span>
      </div>
      <button class="tut-close" (click)="skip()">✕</button>
    </div>

    <!-- Step counter bar -->
    <div class="tut-step-bar">
      <span class="tut-step-dots">
        <span *ngFor="let step of steps; let i = index"
              class="tut-dot"
              [class.active]="i === currentStep"
              (click)="goToStep(i)">
        </span>
      </span>
      <span class="tut-step-counter">{{ (currentStep + 1).toString().padStart(2,'0') }} / {{ totalSteps.toString().padStart(2,'0') }}</span>
    </div>

    <!-- Body -->
    <div class="tut-body">
      <div class="tut-title">{{ currentStepData.title }}</div>
      <p class="tut-desc">{{ currentStepData.description }}</p>

      <div *ngIf="currentStepData.bullets" class="tut-bullets">
        <div *ngFor="let b of currentStepData.bullets" class="tut-bullet">
          <span class="tut-bullet-badge" [style.background]="b.color" [style.color]="'#fff'">{{ b.label }}</span>
          <span class="tut-bullet-text">{{ b.text }}</span>
        </div>
      </div>

      <div *ngIf="currentStepData.image" class="tut-image-wrap">
        <img [src]="currentStepData.image" [alt]="currentStepData.title" class="tut-image">
      </div>
    </div>

    <!-- Footer nav -->
    <div class="tut-footer">
      <button class="tut-btn tut-prev" [disabled]="isFirstStep" (click)="previousStep()">← PREV</button>

      <button *ngIf="!isLastStep" class="tut-btn tut-next" (click)="nextStep()">NEXT →</button>
      <button *ngIf="isLastStep"  class="tut-btn tut-done" (click)="complete()">GOT IT</button>
    </div>

    <!-- Don't show again -->
    <div class="tut-dsa">
      <label class="tut-dsa-label">
        <input type="checkbox" [(ngModel)]="dontShowAgain" class="tut-check">
        <span>don't show again</span>
      </label>
      <button class="tut-skip" (click)="skip()">skip</button>
    </div>

  </div>
</div>
