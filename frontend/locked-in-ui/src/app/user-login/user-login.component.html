<div *ngIf="isLoading" class="loading-overlay">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <p>Logging in...</p>
  </div>
</div>

<div class="login-container" (click)="onBackdropClick($event)">
  <div id="formContent" (click)="$event.stopPropagation()">
    <div class="alert alert-warning" *ngIf="invalidLogin">{{errorMessage}}</div>
    <div class="alert alert-success" *ngIf="loginSuccess">{{successMessage}}</div>
    
    <h2>Login</h2>
    
    <form>
      <input type="text" 
             id="email" 
             [(ngModel)]="email" 
             name="email" 
             placeholder="Email" 
             required>
      
      <input type="password" 
             id="password" 
             [(ngModel)]="password" 
             name="password" 
             placeholder="Password" 
             required>
      
      <input type="submit" 
             (click)="handleLogin()" 
             value="Login">
    </form>
    
    <div class="auth-link">
      Don't have an account? <a routerLink="/register">Register</a>
    </div>
  </div>
</div>
