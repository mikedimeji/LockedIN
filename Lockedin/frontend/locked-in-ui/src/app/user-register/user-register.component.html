<div class="register-container">
  <div id="formContent">
    <!-- Close Button -->
    <button class="close-button" (click)="closeRegisterScreen()">X</button>

    <div class="alert alert-warning" *ngIf="invalidRegister">{{errorMessage}}</div>
    <div class="alert alert-success" *ngIf="RegisterSuccess">{{successMessage}}</div>
    <h2>Register</h2>
    <form>
      <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Username" required>
      <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Email" required>
      <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Password" required>
      <input type="submit" (click)="handleRegister()" value="Register">
    </form>
  </div>
</div>
