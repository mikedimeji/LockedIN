spring.application.name=tokispirit
spring.main.allow-circular-references=true

server.port=${PORT:8080}

# JDBC configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://locked-db-locked.j.aivencloud.com:13547/LockedDB?allowPublicKeyRetrieval=true&useSSL=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.main.allow-bean-definition-overriding=true

spring.sql.init.mode=never

# Disable debug and trace in production
debug=false
trace=false

# Set secure connection pool properties
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000


server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

spring.mvc.cors.allowed-origins=http://localhost:4200,https://lockedin-production-c669.up.railway.app
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.max-age=3600

# Actuator security settings
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Mitigate SQL injection risks
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false

# Stripe (set these in Railway environment variables)
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.price.monthly=${STRIPE_PRICE_MONTHLY:price_placeholder_monthly}
stripe.price.annual=${STRIPE_PRICE_ANNUAL:price_placeholder_annual}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
app.admin-usernames=${ADMIN_USERNAMES:flcl}

# Google Calendar OAuth (set in Railway environment variables)
google.calendar.client-id=${GOOGLE_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET:}
google.calendar.redirect-uri=${GOOGLE_REDIRECT_URI:https://lockedin-production-c669.up.railway.app/api/calendar/callback}